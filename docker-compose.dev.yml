services:
  postgres:
    image: postgres:16-alpine
    container_name: dora-postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=dorauser
      - POSTGRES_PASSWORD=dorapass
      - POSTGRES_DB=doradb
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorauser -d doradb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
