# ── Test Profile ───────────────────────────────────────
# Datasource is set dynamically by AbstractIntegrationTest via Testcontainers

# Hibernate: create-drop for clean schema each run
spring.jpa.hibernate.ddl-auto=create-drop

# Disable features that run on schedule
guardian.feed.enabled=false
crawler.enabled=false
autopilot.scheduler.enabled=false
alert.digest.enabled=false

# Disable data seeding
app.seed.enabled=false

# Dummy API keys — tests use WireMock, not real APIs
anthropic.api.key=test-dummy-key
anthropic.api.model=claude-sonnet-4-20250514
anthropic.api.base-url=http://localhost:${wiremock.port:8089}/v1
resend.api-key=test-dummy-resend-key
jwt.secret=TestSecretKeyThatIsAtLeast256BitsLongForHmacSha256Algorithm2024

# Reduce logging noise during tests
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.security=WARN
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.org.apache.http=WARN
logging.level.org.springframework.web=WARN
