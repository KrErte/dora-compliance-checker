server.port=8080

# PostgreSQL Database (local dev)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:doradb}
spring.datasource.username=${POSTGRES_USER:dorauser}
spring.datasource.password=${POSTGRES_PASSWORD:dorapass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP connection pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Claude API
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=claude-sonnet-4-20250514

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Authentication
jwt.secret=${JWT_SECRET:DoraComplianceCheckerDefaultSecretKeyThatIsAtLeast256BitsLong2024}
jwt.expiration-ms=7200000
jwt.refresh-expiration-days=7

# Guardian (Live Contract Monitoring)
guardian.feed.enabled=${GUARDIAN_FEED_ENABLED:true}
guardian.feed.cron=${GUARDIAN_FEED_CRON:0 0 */2 * * *}

# Alert system
alert.digest.enabled=${ALERT_DIGEST_ENABLED:false}
alert.digest.daily.cron=0 0 8 * * *
alert.digest.weekly.cron=0 0 8 * * MON
alert.enrichment.max-per-cycle=10

# Dev Data Seeding (overridden to false in application-prod.properties)
app.seed.enabled=${APP_SEED_ENABLED:true}

# Resend Email API
resend.api-key=${RESEND_API_KEY:}
resend.from-email=noreply@doraaudit.eu
resend.to-email=info@doraaudit.eu

# Graceful shutdown — let in-flight requests finish (up to 30s)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Trial Configuration
promo.trial.days=30

# OAuth2 Configuration (manually handled in OAuth2Controller)
oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth2.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
oauth2.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}

# Frontend URL for OAuth2 redirect
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# CORS allowed origins (dev includes localhost)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4000,https://doraaudit.eu,https://www.doraaudit.eu}

# LemonSqueezy Webhook
lemonsqueezy.webhook.secret=${LEMONSQUEEZY_WEBHOOK_SECRET:}

# ICT Provider Crawler Configuration
crawler.enabled=${CRAWLER_ENABLED:false}
crawler.cron=${CRAWLER_CRON:0 0 3 * * MON}
crawler.rate-limit-ms=1000
crawler.max-results=500
crawler.ariregister.enabled=true
crawler.teadmik.enabled=true
crawler.eba-ctpp.enabled=true
crawler.google.enabled=${CRAWLER_GOOGLE_ENABLED:false}
crawler.google.api-key=${GOOGLE_API_KEY:}
crawler.google.search-engine-id=${GOOGLE_SEARCH_ENGINE_ID:}

# Autopilot (DORA Compliance Autopilot)
autopilot.scheduler.enabled=${AUTOPILOT_SCHEDULER_ENABLED:false}
autopilot.scheduler.cron=0 0 4 * * *
