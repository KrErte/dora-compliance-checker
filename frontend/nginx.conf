server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively (JS/CSS have content hashes)
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML files — short cache so updates propagate quickly
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prerendered pages: /pricing → /pricing/index.html → fallback /index.html
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=3600";
    }
}
