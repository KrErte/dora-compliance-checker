services:
  postgres:
    image: postgres:16-alpine
    container_name: dora-postgres
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Umami Analytics Database
  umami-db:
    image: postgres:16-alpine
    container_name: dora-umami-db
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    environment:
      - POSTGRES_USER=${UMAMI_DB_USER:-umami}
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:-umami_secret}
      - POSTGRES_DB=${UMAMI_DB_NAME:-umami}
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB_NAME:-umami}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Umami Analytics
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: dora-umami
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      - DATABASE_URL=postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami_secret}@umami-db:5432/${UMAMI_DB_NAME:-umami}
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-replace-me-with-a-random-string}
      - TRACKER_SCRIPT_NAME=${UMAMI_TRACKER_SCRIPT_NAME:-script.js}
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build: ./backend
    container_name: dora-backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - branding_data:/app/data/branding
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GUARDIAN_FEED_ENABLED=${GUARDIAN_FEED_ENABLED:-false}
      - GUARDIAN_FEED_CRON=${GUARDIAN_FEED_CRON:-0 0 6 * * *}
      - CRAWLER_ENABLED=${CRAWLER_ENABLED:-true}
      - CRAWLER_CRON=${CRAWLER_CRON:-0 0 3 * * SUN}
      - CRAWLER_GOOGLE_ENABLED=${CRAWLER_GOOGLE_ENABLED:-false}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_SEARCH_ENGINE_ID=${GOOGLE_SEARCH_ENGINE_ID:-}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_TO_EMAIL=${RESEND_TO_EMAIL:-info@doraaudit.eu}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: dora-frontend
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PostgreSQL Daily Backup (pg_dump, retain 7 days)
  pg-backup:
    image: postgres:16-alpine
    container_name: dora-pg-backup
    restart: unless-stopped
    volumes:
      - pg_backups:/backups
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Backup scheduler started"
        while true; do
          sleep_until=$$(date -d "tomorrow 02:00" +%s 2>/dev/null || date -v+1d -v2H -v0M -v0S +%s)
          now=$$(date +%s)
          sleep_secs=$$(( sleep_until - now ))
          if [ $$sleep_secs -le 0 ]; then sleep_secs=86400; fi
          echo "Next backup in $$sleep_secs seconds"
          sleep $$sleep_secs
          FILENAME="/backups/dora_$$(date +%Y%m%d_%H%M%S).sql.gz"
          echo "Starting backup: $$FILENAME"
          pg_dump | gzip > "$$FILENAME"
          if [ $$? -eq 0 ]; then
            echo "Backup completed: $$FILENAME ($$(du -h $$FILENAME | cut -f1))"
          else
            echo "Backup FAILED"
          fi
          # Remove backups older than 7 days
          find /backups -name "dora_*.sql.gz" -mtime +7 -delete
          echo "Old backups cleaned"
        done
    depends_on:
      postgres:
        condition: service_healthy

  # Caddy Reverse Proxy (HTTPS + subdomain routing)
  caddy:
    image: caddy:2-alpine
    container_name: dora-caddy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - umami

volumes:
  postgres_data:
  umami_postgres_data:
  caddy_data:
  caddy_config:
  branding_data:
  pg_backups:
